<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizForge — Turn any material into exams</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<div class="appbar-wrap">
  <header class="appbar">
    <div class="brand">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40"><rect x="2.5" y="2.5" width="43" height="43" rx="10" fill="#1668E8" stroke="#1E1B16" stroke-width="2.5"/><text x="24" y="33" text-anchor="middle" font-size="27" font-weight="800" fill="#fff" font-family="Arial, sans-serif">?</text></svg>
      </span>
      <div class="brand-text">
        <h1>QuizForge</h1>
        <p>Turn any material into exams</p>
      </div>
    </div>
    <div class="appbar-actions">
      <button class="icon-btn" id="settings-btn" type="button" title="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings-panel">
        <svg class="ic" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg>
        <span>Settings</span>
      </button>
      <button class="icon-btn" id="dark-toggle" type="button" title="Toggle dark mode">
        <span class="ic-moon"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg></span>
        <span class="ic-sun"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg></span>
        <span id="dark-label">Dark</span>
      </button>
    </div>
  </header>

  <div class="settings-panel" id="settings-panel" hidden>
    <h2>Settings</h2>
    <label class="set-row">
      <input type="checkbox" id="set-shuffle">
      <span>Shuffle questions and answer options</span>
    </label>
    <label class="set-row">
      <input type="checkbox" id="set-perq">
      <span>Per-question countdown</span>
    </label>
    <label class="set-row">
      <span>Seconds per question:</span>
      <input type="number" id="set-seconds" min="5" max="600" value="60">
    </label>
    <p class="set-note">Settings are saved on this device and apply to the next question you start.</p>
  </div>
</div>

<nav class="view-nav" aria-label="Main views">
  <button class="nav-tab active" id="nav-create" type="button">✦ Create exam</button>
  <button class="nav-tab" id="nav-library" type="button">▤ My exams <span class="nav-count" id="nav-lib-count" hidden></span></button>
</nav>

<div id="app"></div>

<footer id="foot">QuizForge — upload any material, bring your own AI key, get an exam. Your key never leaves your browser except to the provider you choose.</footer>

</div>

<script src="app.js"></script>
</body>
</html>
